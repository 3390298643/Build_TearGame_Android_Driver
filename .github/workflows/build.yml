name: Build GKI 6.12 Kernel and Module

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      kernel_branch:
        description: 'Kernel branch to build'
        required: false
        default: 'android16-6.12'
      build_kernel:
        description: 'Build kernel (true/false)'
        required: false
        default: 'true'
      build_module:
        description: 'Build module (true/false)'
        required: false
        default: 'true'

env:
  KERNEL_BRANCH: ${{ github.event.inputs.kernel_branch || 'android16-6.12' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360  # 6 hours timeout for kernel build
    # Only run full build on push to main/master or manual trigger
    if: github.event_name != 'pull_request'
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Free disk space
        run: |
          echo "Freeing up disk space..."
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h
      
      - name: Install dependencies
        run: |
          echo "Installing build dependencies..."
          sudo apt-get update
          sudo apt-get install -y \
            git \
            curl \
            wget \
            python3 \
            python3-pip \
            build-essential \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            libncurses-dev \
            zip \
            unzip \
            lz4 \
            cpio \
            kmod
          
          # Install LLVM/Clang toolchain
          echo "Installing LLVM/Clang..."
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo apt-key add -
          sudo add-apt-repository -y "deb http://apt.llvm.org/jammy/ llvm-toolchain-jammy-17 main"
          sudo apt-get update
          sudo apt-get install -y \
            clang-17 \
            lld-17 \
            llvm-17 \
            llvm-17-dev \
            llvm-17-tools
          
          # Create symlinks for LLVM tools
          sudo ln -sf /usr/bin/clang-17 /usr/bin/clang
          sudo ln -sf /usr/bin/clang++-17 /usr/bin/clang++
          sudo ln -sf /usr/bin/ld.lld-17 /usr/bin/ld.lld
          sudo ln -sf /usr/bin/llvm-ar-17 /usr/bin/llvm-ar
          sudo ln -sf /usr/bin/llvm-nm-17 /usr/bin/llvm-nm
          sudo ln -sf /usr/bin/llvm-objcopy-17 /usr/bin/llvm-objcopy
          sudo ln -sf /usr/bin/llvm-objdump-17 /usr/bin/llvm-objdump
          sudo ln -sf /usr/bin/llvm-strip-17 /usr/bin/llvm-strip
          sudo ln -sf /usr/bin/llvm-readelf-17 /usr/bin/llvm-readelf
          
          # Install cross-compile toolchain
          sudo apt-get install -y \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu
          
          # Verify installations
          echo "Verifying installations..."
          clang --version
          aarch64-linux-gnu-gcc --version
      
      - name: Install repo tool
        run: |
          echo "Installing repo tool..."
          mkdir -p ~/bin
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH
          
          # Configure git
          git config --global user.email "github-actions@github.com"
          git config --global user.name "GitHub Actions"
          git config --global color.ui false
      
      - name: Download kernel source
        if: ${{ github.event.inputs.build_kernel != 'false' }}
        run: |
          echo "Downloading GKI kernel source..."
          chmod +x scripts/download_kernel.sh
          ./scripts/download_kernel.sh
        env:
          KERNEL_DIR: kernel-source
      
      - name: Build kernel
        if: ${{ github.event.inputs.build_kernel != 'false' }}
        run: |
          echo "Building kernel..."
          chmod +x scripts/build_kernel.sh
          ./scripts/build_kernel.sh
        env:
          KERNEL_DIR: kernel-source
          OUT_DIR: out
      
      - name: Build Hello World module
        if: ${{ github.event.inputs.build_module != 'false' }}
        run: |
          echo "Building Hello World kernel module..."
          chmod +x scripts/build_module.sh
          ./scripts/build_module.sh
        env:
          KERNEL_DIR: kernel-source
          KERNEL_OUT: out
          MODULE_DIR: hello_module
          MODULE_OUT: module_out
      
      - name: Prepare artifacts
        run: |
          echo "Preparing artifacts..."
          mkdir -p artifacts
          
          # Copy kernel image if exists
          if [ -f "out/arch/arm64/boot/Image" ]; then
            cp out/arch/arm64/boot/Image artifacts/
            echo "Kernel Image copied"
          elif [ -f "out/Image" ]; then
            cp out/Image artifacts/
            echo "Kernel Image copied"
          fi
          
          # Copy module if exists
          if [ -f "module_out/hello.ko" ]; then
            cp module_out/hello.ko artifacts/
            echo "hello.ko copied"
          elif [ -f "hello_module/hello.ko" ]; then
            cp hello_module/hello.ko artifacts/
            echo "hello.ko copied"
          fi
          
          # Copy Module.symvers if exists
          if [ -f "out/Module.symvers" ]; then
            cp out/Module.symvers artifacts/
          fi
          
          # Create build info
          echo "Build Information" > artifacts/build_info.txt
          echo "=================" >> artifacts/build_info.txt
          echo "Date: $(date)" >> artifacts/build_info.txt
          echo "Kernel Branch: ${KERNEL_BRANCH}" >> artifacts/build_info.txt
          echo "Runner: ${{ runner.os }}" >> artifacts/build_info.txt
          echo "Clang Version: $(clang --version | head -1)" >> artifacts/build_info.txt
          
          # List artifacts
          echo "Artifacts:"
          ls -la artifacts/
      
      - name: Upload kernel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gki-kernel-6.12-build
          path: artifacts/
          retention-days: 30
          if-no-files-found: warn
      
      - name: Upload module artifact
        uses: actions/upload-artifact@v4
        with:
          name: hello-module
          path: |
            module_out/hello.ko
            hello_module/hello.ko
          retention-days: 30
          if-no-files-found: warn

  # Quick syntax check job (runs on every push)
  syntax-check:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Check shell scripts syntax
        run: |
          echo "Checking shell script syntax..."
          for script in scripts/*.sh; do
            if [ -f "$script" ]; then
              echo "Checking $script..."
              bash -n "$script"
              echo "✓ $script syntax OK"
            fi
          done
          echo "All scripts syntax check passed!"
      
      - name: Verify module source
        run: |
          echo "Verifying module source files..."
          echo "=== hello.c ==="
          head -30 hello_module/hello.c
          echo ""
          echo "=== Makefile ==="
          cat hello_module/Makefile
          echo ""
          echo "Module source verification complete"
      
      - name: Validate workflow YAML
        run: |
          echo "Workflow file structure:"
          head -50 .github/workflows/build.yml
          echo "Workflow validation complete"
