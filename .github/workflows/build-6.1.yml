name: Android Kernel 6.1 Build

on:
  workflow_dispatch:
    inputs:
      android_version:
        description: 'Android Version (e.g., 14)'
        required: true
        default: '14'
      kernel_version:
        description: 'Kernel Version (e.g., 6.1)'
        required: true
        default: '6.1'
      target_arch:
        description: 'Target Architecture (aarch64, x86_64)'
        required: true
        default: 'aarch64'
      mirror:
        description: 'Mirror source (tuna/ustc/google)'
        required: true
        default: 'google'

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Check disk space
        run: df -h

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential flex bison libssl-dev libelf-dev bc python3 git-core gnupg curl zlib1g-dev libncurses5-dev unzip rsync

      - name: Install repo tool
        run: |
          if ! command -v repo &> /dev/null; then
            sudo curl -L https://storage.googleapis.com/git-repo-downloads/repo -o /usr/local/bin/repo
            sudo chmod a+x /usr/local/bin/repo
          fi
          git config --global user.email "builder@github.com"
          git config --global user.name "Kernel Builder"

      - name: Set mirror URL
        id: mirror
        run: |
          case "${{ github.event.inputs.mirror }}" in
            tuna)
              echo "MANIFEST_URL=https://mirrors.tuna.tsinghua.edu.cn/git/AOSP/kernel/manifest" >> $GITHUB_ENV
              ;;
            ustc)
              echo "MANIFEST_URL=https://mirrors.ustc.edu.cn/aosp/kernel/manifest" >> $GITHUB_ENV
              ;;
            google|*)
              echo "MANIFEST_URL=https://android.googlesource.com/kernel/manifest" >> $GITHUB_ENV
              ;;
          esac

      - name: Set up Android Kernel source
        run: |
          mkdir -p android-kernel && cd android-kernel
          
          # 初始化 repo
          repo init -u ${{ env.MANIFEST_URL }} -b common-android${{ github.event.inputs.android_version }}-${{ github.event.inputs.kernel_version }} --depth=1
          
          # 同步源码
          repo sync -c --no-tags --optimized-fetch --force-sync -j$(nproc)
          
      - name: Check disk after sync
        run: |
          df -h
          du -sh android-kernel/

      - name: Build kernel and driver with make
        run: |
          cd android-kernel/common
          
          # 设置编译环境
          export ARCH=${{ github.event.inputs.target_arch }}
          export CROSS_COMPILE=aarch64-linux-gnu-
          
          # 使用 GKI 配置
          make gki_defconfig
          
          # 编译内核（生成必要的头文件和配置）
          make -j$(nproc)
          
          # 复制你的驱动代码
          cp -r ${{ github.workspace }}/code drivers/
          
          # 编译你的驱动模块
          make M=drivers/code modules

      - name: Upload kernel artifacts
        uses: actions/upload-artifact@v4.6.2
        with:
          name: android-kernel-${{ github.event.inputs.android_version }}-${{ github.event.inputs.kernel_version }}-${{ github.event.inputs.target_arch }}
          path: |
            android-kernel/common/arch/${{ github.event.inputs.target_arch }}/boot/Image
            android-kernel/common/arch/${{ github.event.inputs.target_arch }}/boot/Image.gz
            android-kernel/common/vmlinux
            android-kernel/common/drivers/code/*.ko

      - name: Cleanup workspace
        if: always()
        run: |
          rm -rf android-kernel

